                                                                {isTaken && <div className="absolute inset-0 bg-black/60 flex items-center justify-center backdrop-blur-[1px]"><span className="text-white font-bold bg-red-600 px-2 py-0.5 rounded text-[10px] rotate-[-15deg]">PRESO</span></div>}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            <div className="mt-4 pt-4 border-t border-slate-700 flex justify-end shrink-0 gap-4">
                                                {!me?.isReady ? (
                                                    <button
                                                        onClick={() => updateRoom({ [`players.${user.uid}.isReady`]: true })}
                                                        disabled={!me?.characterId}
                                                        className={`flex items-center gap-2 px-8 py-3 rounded-2xl font-black text-lg uppercase transition-all ${!me?.characterId ? 'bg-slate-700 text-slate-500' : 'bg-emerald-500 text-white hover:bg-emerald-400 hover:scale-105 shadow-lg'}`}
                                                    >Conferma <ArrowRight className="w-5 h-5" /></button>
                                                ) : (
                                                    isHost && allHumansReady ? (
                                                        <button
                                                            onClick={startGameWithBotsAndArena}
                                                            className="flex items-center gap-2 px-8 py-3 rounded-2xl font-black text-lg uppercase transition-all bg-yellow-500 text-slate-900 hover:bg-yellow-400 hover:scale-105 shadow-[0_0_20px_rgba(234,179,8,0.5)] animate-pulse"
                                                        >Avvia Partita! <Play className="w-5 h-5" /></button>
                                                    ) : (
                                                        <div className="flex items-center gap-2 px-6 py-3 rounded-2xl font-black text-sm md:text-lg uppercase bg-slate-700 text-slate-300">
                                                            In attesa {isHost ? "dei giocatori" : "dell'Host"}...
                                                        </div>
                                                    )
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* SCHERMATA ARENA */}
                            {roomData.state === 'ARENA' && (() => {
                                const isChoosing = roomData.arena.matchState === 'CHOOSING_CHALLENGERS';
                                const displayIds = isChoosing && rouletteIds.length === 2 
                                    ? rouletteIds 
                                    : roomData.arena.challengerIds;

                                const minigameName = roomData.arena.minigame === 'MINESWEEPER' ? 'CAMPO MINATO' : (roomData.arena.minigame === 'SIMONSAYS' ? 'SIMON SAYS' : 'DADI');

                                return (
                                    <div className={`flex flex-col items-center justify-center h-full w-full max-w-5xl mx-auto animate-in zoom-in-95 ${deadPlayers.length > 0 ? 'pl-28 md:pl-0' : ''}`}>
                                        
                                        {/* INTESTAZIONE MINIGIOCO */}
                                        {!isChoosing && (
                                            <div className="mb-6 bg-slate-800/80 px-8 py-2 rounded-full border border-slate-600 shadow-xl hidden md:flex items-center gap-2">
                                                {roomData.arena.minigame === 'SIMONSAYS' ? <BrainCircuit className="text-pink-400 w-6 h-6" /> : <Gamepad2 className="text-yellow-400 w-6 h-6" />}
                                                <span className="text-xl font-black text-white tracking-widest uppercase">SFIDA: {minigameName}</span>
                                            </div>
                                        )}

                                        <div className={`flex flex-col md:flex-row items-center justify-center w-full ${roomData.arena.minigame !== 'DICE' && !isChoosing ? 'gap-6 md:gap-12' : 'gap-8 md:gap-24'}`}>
                                            
                                            {/* GIOCATORE SINISTRA */}
                                            {displayIds.length === 2 && renderFighter(displayIds[0], 0, isChoosing)}
                                            
                                            {/* AREA CENTRALE (VS O MINIGIOCO) */}
                                            {displayIds.length === 2 && (
                                                <div className="flex flex-col items-center justify-center z-30 min-w-[150px] md:min-w-[200px]">
                                                    {isChoosing ? (
                                                        <div className="flex flex-col items-center pointer-events-none">
                                                            <Swords className="w-16 h-16 md:w-20 md:h-20 text-yellow-400 animate-[spin_0.5s_linear_infinite] drop-shadow-[0_0_20px_rgba(250,204,21,0.5)]" />
                                                            <span className="text-sm md:text-xl font-black text-white bg-slate-900/90 px-4 py-1 rounded-full backdrop-blur mt-2 border border-slate-700 animate-pulse">SCELTA...</span>
                                                        </div>
                                                    ) : roomData.arena.minigame === 'MINESWEEPER' ? (
                                                        <div className="flex flex-col items-center">
                                                            <div className={`mb-3 px-4 md:px-6 py-1 md:py-2 rounded-full font-bold text-[10px] md:text-sm uppercase tracking-widest shadow-lg border-2 ${roomData.arena.minesweeper?.turn === displayIds[0] ? 'bg-indigo-900 border-indigo-400 text-indigo-200' : 'bg-rose-900 border-rose-400 text-rose-200'}`}>
                                                                Turno di: {roomData.players[roomData.arena.minesweeper?.turn]?.name || '?'}
                                                            </div>
                                                            <div className="grid grid-cols-5 gap-1.5 md:gap-2 bg-slate-800 p-2.5 md:p-3 rounded-2xl shadow-[0_0_20px_rgba(0,0,0,0.5)] border border-slate-700">
                                                                {roomData.arena.minesweeper?.board.map((cell, idx) => {
                                                                    const isRevealed = cell.revealedBy !== null;
                                                                    const isBomb = cell.hasBomb;
                                                                    const showBomb = isRevealed && isBomb;
                                                                    const showSafe = isRevealed && !isBomb;
                                                                    
                                                                    let cellColor = 'bg-slate-700 cursor-pointer shadow-sm';
                                                                    if (isRevealed) {
                                                                        cellColor = isBomb ? 'bg-red-500 shadow-[0_0_10px_rgba(239,68,68,0.8)]' : 'bg-slate-900 shadow-inner';
                                                                    }

                                                                    return (
                                                                        <div
                                                                            key={idx}
                                                                            onClick={() => clickMinesweeperTile(idx)}
                                                                            className={`w-10 h-10 md:w-14 md:h-14 rounded-xl flex items-center justify-center transition-all ${cellColor} ${!isRevealed && roomData.arena.minesweeper.turn === user.uid ? 'hover:bg-slate-600 hover:scale-105' : ''}`}
                                                                        >
                                                                            {showBomb && <Bomb className="w-6 h-6 md:w-8 md:h-8 text-white animate-bounce" />}
                                                                            {showSafe && <div className="w-3 h-3 md:w-4 md:h-4 rounded-full bg-emerald-500 opacity-50" />}
                                                                        </div>
                                                                    )
                                                                })}
                                                            </div>
                                                        </div>
                                                    ) : roomData.arena.minigame === 'SIMONSAYS' ? (
                                                        <div className="flex flex-col items-center">
                                                            <div className={`mb-4 px-4 md:px-6 py-1 md:py-2 rounded-full font-bold text-[10px] md:text-sm uppercase tracking-widest shadow-lg border-2 ${roomData.arena.simonsays?.phase === 'WATCH' ? 'bg-indigo-900 border-indigo-400 text-indigo-200 animate-pulse' : 'bg-emerald-900 border-emerald-400 text-emerald-200 animate-bounce'}`}>
                                                                {roomData.arena.simonsays?.phase === 'WATCH' ? 'OSSERVA...' : 'RIPETI!'}
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-1.5 md:gap-2 bg-slate-800 p-2 md:p-3 rounded-full shadow-[0_0_30px_rgba(0,0,0,0.5)] border-4 border-slate-700 w-32 h-32 md:w-48 md:h-48">
                                                                {SIMON_COLORS.map((col, idx) => (
                                                                    <div
                                                                        key={idx}
                                                                        onClick={() => clickSimonColor(idx)}
                                                                        className={`w-full h-full ${col.shape} transition-all duration-200 border-4 border-slate-900 cursor-pointer
                                                                        ${simonLit === idx ? `${col.bg} ${col.glow} brightness-150` : `${col.bg} opacity-50 hover:opacity-75`}
                                                                        `}
                                                                    />
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div className="flex flex-col items-center pointer-events-none hidden md:flex">
                                                            <Swords className="w-16 h-16 md:w-20 md:h-20 text-yellow-400 animate-[pulse_2s_ease-in-out_infinite] drop-shadow-[0_0_20px_rgba(250,204,21,0.5)]" />
                                                            <span className="text-xl md:text-3xl font-black text-white bg-slate-900/80 px-4 py-1 rounded-full backdrop-blur mt-2 border border-slate-700">VS</span>
                                                        </div>
                                                    )}
                                                </div>
                                            )}

                                            {/* GIOCATORE DESTRA */}
                                            {displayIds.length === 2 && renderFighter(displayIds[1], 1, isChoosing)}
                                        </div>
                                    </div>
                                );
                            })()}

                            {/* SCHERMATA GAME OVER */}
                            {roomData.state === 'GAME_OVER' && (
                                <div className="flex flex-col items-center justify-center h-full animate-in zoom-in duration-500">
                                    <Trophy className="w-32 h-32 text-yellow-400 mb-6 animate-bounce drop-shadow-[0_0_40px_rgba(250,204,21,0.6)]" />
                                    <h1 className="text-4xl md:text-5xl font-black text-white mb-4 uppercase tracking-widest text-center">
                                        {roomData.winnerId ? 'Abbiamo un Vincitore!' : 'Pareggio Globale?!'}
                                    </h1>

                                    {roomData.config.isCompetitive && myRRChange !== null && (
                                        <div className={`mb-8 px-8 py-3 rounded-full font-black text-2xl md:text-3xl animate-bounce shadow-xl flex items-center gap-3 ${myRRChange > 0 ? 'bg-emerald-500/20 text-emerald-400 border-2 border-emerald-500' : 'bg-red-500/20 text-red-400 border-2 border-red-500'}`}>
                                            <Medal className="w-8 h-8" />
                                            {myRRChange > 0 ? `+${myRRChange} RR` : `${myRRChange} RR`}
                                        </div>
                                    )}
                                    
                                    {roomData.winnerId && roomData.players[roomData.winnerId] && (() => {
                                        const winner = roomData.players[roomData.winnerId];
                                        const char = CHARACTERS.find(c => c.id === winner.characterId);
                                        return (
                                            <div className="flex flex-col items-center bg-slate-800/80 p-8 rounded-3xl border border-slate-600 shadow-2xl relative mt-4">
                                                
                                                {roomData.config.isCompetitive && (
                                                    <div className="absolute -top-4 right-4 animate-bounce"><RankBadge rr={winner.rr} /></div>
                                                )}

                                                <div className={`w-40 h-40 rounded-3xl ${char.color} flex items-center justify-center p-2 border-4 border-white/50 mb-4 shadow-[0_0_40px_rgba(255,255,255,0.2)]`}>
                                                    <img src={char.img} className="w-full h-full object-cover rounded-2xl" />
                                                </div>
                                                <p className={`text-4xl font-black ${winner.id === user.uid ? 'text-yellow-400' : 'text-white'}`}>
                                                    {winner.name} {winner.id === user.uid ? '(TU!)' : ''}
                                                </p>
                                            </div>
                                        );
                                    })()}

                                    {isHost && (
                                        <button 
                                            onClick={leaveRoom}
                                            className="mt-10 bg-white hover:bg-slate-200 text-slate-900 font-bold text-xl px-10 py-4 rounded-xl shadow-lg transition-transform hover:scale-105"
                                        >Chiudi Stanza</button>
                                    )}
                                    {!isHost && (
                                        <p className="mt-8 text-slate-400">In attesa che l'Host chiuda la stanza...</p>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
