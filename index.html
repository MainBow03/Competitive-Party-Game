        function getRank(rr) {
            let currentRank = RANKS[0];
            for (let rank of RANKS) {
                if (rr >= rank.minRR) {
                    currentRank = rank;
                } else {
                    break;
                }
            }
            return currentRank;
        }

                </span>
            );
        };

        function calculateRRChange(placement) {
            if (placement === 8 || placement === 7) return - (Math.floor(Math.random() * 6) + 15);

            if (placement === 5) return - (Math.floor(Math.random() * 5) + 1);

            { name: "Zenitsu", img: "https://i.pinimg.com/1200x/91/12/9d/91129dee62e996da6313160605cb514d.jpg" },
            { name: "Nezuko", img: "https://i.pinimg.com/1200x/72/b7/56/72b756ee900c26b3e616ba439e1f05c2.jpg" },
            { name: "Shinobu", img: "https://i.pinimg.com/736x/8b/71/a5/8b71a53282f08aea93f83852a01e4e44.jpg" },
            { name: "Tengen", img: "https://i.pinimg.com/736x/33/ef/07/33ef07083eb82a6e314b32b2d6e72295.jpg" },
            { name: "Aang", img: "https://i.pinimg.com/736x/21/c6/02/21c60273e7409b871140d5cee2cace5b.jpg" },
            { name: "Zuko", img: "https://i.pinimg.com/736x/1d/3f/9e/1d3f9e62fdc463541fb404840372c3a4.jpg" },
            { name: "Azula", img: "https://i.pinimg.com/1200x/1f/e1/ca/1fe1ca1b65f53387496522b0df72831e.jpg" },
            { name: "Sephiroth", img: "https://i.pinimg.com/1200x/2f/5d/28/2f5d281e60a0a595a941a15ef3b5a454.jpg" },
            { name: "Katara", img: "https://i.pinimg.com/736x/88/3b/a4/883ba48c5727d96962d2a93536f04c17.jpg" },
            { name: "Toph", img: "https://i.pinimg.com/736x/ac/0e/6c/ac0e6c1b3329b309d09cb44e968a41d7.jpg" },
            { name: "Sokka", img: "https://i.pinimg.com/736x/61/a7/91/61a7919a2c2df87b0106a425c031b9ca.jpg" }
        ];

        const COLORS = [
            'bg-purple-500', 'bg-orange-500', 'bg-amber-600', 'bg-pink-500', 
            'bg-emerald-500', 'bg-sky-500', 'bg-red-500', 'bg-lime-500',
            'bg-indigo-500', 'bg-teal-500', 'bg-cyan-500', 'bg-rose-500'
        ];

        // --- SIMON SAYS CONFIG ---
        const SIMON_COLORS = [
            { bg: 'bg-green-500', glow: 'shadow-[0_0_30px_rgba(34,197,94,1)]', shape: 'rounded-tl-[3rem] md:rounded-tl-[4rem]' }, // Top-Left
            { bg: 'bg-red-500', glow: 'shadow-[0_0_30px_rgba(239,68,68,1)]', shape: 'rounded-tr-[3rem] md:rounded-tr-[4rem]' }, // Top-Right
            { bg: 'bg-yellow-400', glow: 'shadow-[0_0_30px_rgba(250,204,21,1)]', shape: 'rounded-bl-[3rem] md:rounded-bl-[4rem]' }, // Bottom-Left
            { bg: 'bg-blue-500', glow: 'shadow-[0_0_30px_rgba(59,130,246,1)]', shape: 'rounded-br-[3rem] md:rounded-br-[4rem]' }  // Bottom-Right
        ];

        const CHARACTERS = RAW_CHARACTERS.map((char, index) => {
            const colorClass = COLORS[index % COLORS.length];
            const colorName = colorClass.split('-')[1];
            return {
                id: `c${index + 1}`,
                name: char.name,
                img: char.img.trim(),
                color: colorClass,
                shadow: `shadow-${colorName}-500/50`
            };
        });

        // --- COMPONENTE PRINCIPALE ---
        function App() {
            const [user, setUser] = useState(null);
            const [userStats, setUserStats] = useState(null);
            const [playerName, setPlayerName] = useState('');
            const [uiState, setUiState] = useState('LOADING'); 
            const [joinCode, setJoinCode] = useState('');
            const [errorMsg, setErrorMsg] = useState('');
            const [rouletteIds, setRouletteIds] = useState([]);
            const [myRRChange, setMyRRChange] = useState(null);
            const [simonLit, setSimonLit] = useState(null); // Stato UI locale per animazioni Simon

            const [roomId, setRoomId] = useState(null);
            const [roomData, setRoomData] = useState(null);

            const [lobbyConfig, setLobbyConfig] = useState({ maxPlayers: 4, startingLives: 4, isCompetitive: false });

            const processedGamesRef = useRef(new Set());
            const arenaStartTimeRef = useRef(null);
            const handledRoundRef = useRef(-1); 
            const botMoveCountRef = useRef(''); // Cambiato a stringa per gestire id complessi (es. per Simon)

            // 1. Auth Init & Stats Listener
            useEffect(() => {
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                        setUiState('NAME_INPUT');
                    } else {
                        signInAnonymously(auth).catch(err => {
                            console.error("Auth error", err);
                            setErrorMsg("Errore: Abilita l'Autenticazione Anonima su Firebase!");
                            setUiState('ERROR');
                        });
                    }
                });
                return () => unsubscribe();
            }, []);

            // 1.b Ascolta statistiche utente
            useEffect(() => {
                if (!user) return;
                const unsubStats = onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.rr === undefined) {
                            data.rr = 200;
                            setDoc(doc(db, "users", user.uid), { rr: 200 }, { merge: true });
                        }
                        setUserStats(data);
                    } else {
                        const defaultStats = { gamesPlayed: 0, wins: 0, timePlayedSeconds: 0, characterUsage: {}, rr: 200 };
                        setDoc(doc(db, "users", user.uid), defaultStats);
                        setUserStats(defaultStats);
                    }
                });
                return () => unsubStats();
            }, [user]);

            // 2. Room Listener
            useEffect(() => {
                if (!roomId || !user) return;
                const unsub = onSnapshot(doc(db, "rooms", roomId), (document) => {
                    if (document.exists()) {
                        setRoomData(document.data());
                    } else {
                        setRoomId(null);
                        setRoomData(null);
                        setUiState('MAIN_MENU');
                        setErrorMsg('La stanza è stata chiusa.');
                        setTimeout(() => setErrorMsg(''), 3000);
                    }
                });
                return () => unsub();
            }, [roomId, user]);

            // --- TRACCIAMENTO STATISTICHE E RR UMANI ---
            useEffect(() => {
                if (!roomData || !user || !userStats) return;

                if (roomData.state === 'ARENA' && !arenaStartTimeRef.current) {
                    arenaStartTimeRef.current = Date.now();
                }

                const myPlayer = roomData.players[user.uid];
                const isGameOver = roomData.state === 'GAME_OVER';
                const iAmWinner = isGameOver && roomData.winnerId === user.uid;

                if (myPlayer?.placement && !processedGamesRef.current.has(roomData.id)) {
                    processedGamesRef.current.add(roomData.id);

                    let elapsedSeconds = 0;
                    if (arenaStartTimeRef.current) {
                        elapsedSeconds = Math.floor((Date.now() - arenaStartTimeRef.current) / 1000);
                        arenaStartTimeRef.current = null;
                    }

                    const updates = {
                        gamesPlayed: increment(1),
                        timePlayedSeconds: increment(elapsedSeconds)
                    };
                    
                    if (iAmWinner) updates.wins = increment(1);
                    if (myPlayer.characterId) updates[`characterUsage.${myPlayer.characterId}`] = increment(1);

                    if (roomData.config.isCompetitive && myPlayer.rrChange !== undefined) {
                        setMyRRChange(myPlayer.rrChange);
                        updates.rr = Math.max(0, (userStats.rr || 200) + myPlayer.rrChange);
                    }

                    updateDoc(doc(db, "users", user.uid), updates).catch(console.error);
                }
            }, [roomData, user, userStats]);

            // --- MULTIPLAYER ACTIONS ---
            
            const createRoom = async () => {
                if (!user || !playerName.trim()) return;
                const newRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();

                const initialData = {
                    id: newRoomId,
                    hostId: user.uid,
                    state: 'CHAR_SELECT',
                    config: lobbyConfig,
                    players: {
                        [user.uid]: {
                            id: user.uid,
                            name: playerName.trim(),
                            isBot: false,
                            characterId: null,
                            lives: lobbyConfig.startingLives,
                            isReady: false,
                            rr: userStats?.rr !== undefined ? userStats.rr : 200
                        }
                    },
                    arena: {
                        challengerIds: [],
                        matchState: 'WAITING',
                        minigame: 'DICE',
                        rolls: {},
                        minesweeper: null,
                        simonsays: null,
                        round: 1
                    },
                    winnerId: null
                };

                await setDoc(doc(db, "rooms", newRoomId), initialData);
                setRoomId(newRoomId);
            };

            const joinRoom = async () => {
                if (!user || !playerName.trim() || !joinCode.trim()) return;
                const code = joinCode.toUpperCase();
                setRoomId(code);
            };

            useEffect(() => {
                if (roomId && roomData && !roomData.players[user.uid]) {
                    if (roomData.state !== 'CHAR_SELECT') {
                        setRoomId(null);
                        setErrorMsg('La partita è già iniziata!');
                        setTimeout(() => setErrorMsg(''), 3000);
                        return;
                    }

                    const currentPlayersCount = Object.keys(roomData.players).length;
                    
                    if (currentPlayersCount >= roomData.config.maxPlayers) {
                        setRoomId(null);
                        setErrorMsg('La stanza è piena!');
                        setTimeout(() => setErrorMsg(''), 3000);
                        return;
                    }
                    
                    const newPlayers = { ...roomData.players };
                    newPlayers[user.uid] = {
                        id: user.uid,
                        name: playerName.trim(),
                        isBot: false,
                        characterId: null,
                        lives: roomData.config.startingLives || 4,
                        isReady: false,
                        rr: userStats?.rr !== undefined ? userStats.rr : 200
                    };

                    updateDoc(doc(db, "rooms", roomId), { players: newPlayers });
                }
            }, [roomData, roomId, user]);

            const updateRoom = async (updates) => {
                if (!roomId) return;
                await updateDoc(doc(db, "rooms", roomId), updates);
            };

            // --- LOGICA HOST & ROUNDS ---
            const isHost = roomData && user && roomData.hostId === user.uid;

            const startNewRound = async (roomDataCurrent) => {
                if (!isHost || !roomData) return;

                const data = roomDataCurrent || roomData;
                const alivePlayers = Object.values(data.players).filter(p => p.lives > 0);
                
                if (alivePlayers.length <= 1) {
                    const updates = {
                        state: 'GAME_OVER',
                        winnerId: alivePlayers[0]?.id || null
                    };
                    
                    if (alivePlayers[0]) {
                        const winnerId = alivePlayers[0].id;
                        updates[`players.${winnerId}.placement`] = 1;
                        if (data.config.isCompetitive) {
                            const rrChange = calculateRRChange(1);
                            updates[`players.${winnerId}.rrChange`] = rrChange;
                            
                            if (alivePlayers[0].isBot) {
                                const botRealName = alivePlayers[0].originalBotName;
                                const currentBotRR = alivePlayers[0].rr || 200;
                                const newBotRR = Math.max(0, currentBotRR + rrChange);
                                setDoc(doc(db, "competitive_bots", botRealName), { rr: newBotRR }, { merge: true }).catch(console.error);
                            }
                        }
                    }
                    await updateRoom(updates);
                    return;
                }

                const idx1 = Math.floor(Math.random() * alivePlayers.length);
                let idx2 = Math.floor(Math.random() * alivePlayers.length);
                while (idx1 === idx2) {
                    idx2 = Math.floor(Math.random() * alivePlayers.length);
                }

                const c1 = alivePlayers[idx1].id;
                const c2 = alivePlayers[idx2].id;

                const minigameOptions = ['DICE', 'MINESWEEPER', 'SIMONSAYS'];
                const minigameType = minigameOptions[Math.floor(Math.random() * minigameOptions.length)];
                
                let minesweeperData = null;
                let simonsaysData = null;

                if (minigameType === 'MINESWEEPER') {
                    const board = Array(25).fill({ hasBomb: false, revealedBy: null });
                    let bombsPlaced = 0;
                    while(bombsPlaced < 3) {
                        const idx = Math.floor(Math.random() * 25);
                        if (!board[idx].hasBomb) {
                            board[idx] = { hasBomb: true, revealedBy: null };
                            bombsPlaced++;
                        }
                    }
                    minesweeperData = { board, turn: c1, bombsFound: { [c1]: 0, [c2]: 0 }, moveCount: 0 };
                } else if (minigameType === 'SIMONSAYS') {
                    // Genera sequenza iniziale di 3
                    simonsaysData = {
                        sequence: [Math.floor(Math.random() * 4), Math.floor(Math.random() * 4), Math.floor(Math.random() * 4)],
                        phase: 'WATCH', // WATCH, PLAY
                        progress: { [c1]: 0, [c2]: 0 }
                    };
                }

                await updateRoom({
                    state: 'ARENA',
                    'arena.challengerIds': [c1, c2],
                    'arena.matchState': 'CHOOSING_CHALLENGERS',
                    'arena.minigame': minigameType,
                    'arena.rolls': {},
                    'arena.minesweeper': minesweeperData,
                    'arena.simonsays': simonsaysData,
                    'arena.round': (data.arena?.round || 0) + 1
                });
            };

            const startGameWithBotsAndArena = async () => {
                if (!isHost || !roomData) return;

                const playersList = Object.values(roomData.players);
                const humanPlayers = playersList.filter(p => !p.isBot);
                const botsNeeded = roomData.config.maxPlayers - humanPlayers.length;

                const takenChars = humanPlayers.map(p => p.characterId);
                let availableChars = CHARACTERS.map(c => c.id).filter(id => !takenChars.includes(id));

                const newPlayers = { ...roomData.players };

                let botRRs = {};
                let availableCompBots = [...COMPETITIVE_BOT_NAMES];
                
                if (roomData.config.isCompetitive) {
                    try {
                        const botsSnap = await getDocs(collection(db, "competitive_bots"));
                        botsSnap.forEach(doc => {
                            botRRs[doc.id] = doc.data().rr;
                        });
                    } catch (e) {
                        console.error("Error fetching bots", e);
                    }
                }

                for (let i = 0; i < botsNeeded; i++) {
                    const botId = `bot_${Math.random().toString(36).substr(2, 9)}`;
                    const randIdx = Math.floor(Math.random() * availableChars.length);
                    const charId = availableChars.splice(randIdx, 1)[0];
                    const charObj = CHARACTERS.find(c => c.id === charId);

                    let botName, originalBotName, botRR;

                    if (roomData.config.isCompetitive) {
                        const randNameIdx = Math.floor(Math.random() * availableCompBots.length);
                        botName = availableCompBots.splice(randNameIdx, 1)[0];
                        originalBotName = botName;
                        botRR = botRRs[botName] !== undefined ? botRRs[botName] : 200;
                    } else {
                        botName = charObj.name; 
                        originalBotName = BOT_NAMES[i % BOT_NAMES.length];
                        botRR = 200;
                    }

                    newPlayers[botId] = {
                        id: botId,
                        name: botName,
                        isBot: true,
                        characterId: charId,
                        lives: roomData.config.startingLives || 4,
                        isReady: true,
                        rr: botRR,
                        originalBotName: originalBotName
                    };
                }

                const simulatedData = { ...roomData, players: newPlayers };
                
                await updateRoom({ players: newPlayers });
                startNewRound(simulatedData);
            };

            // --- DECRETO SCONFITTA GLOBALE ---
            const handleLoser = async (loserId, roundNum) => {
                if (handledRoundRef.current === roundNum) return;
                handledRoundRef.current = roundNum;

                updateRoom({ 'arena.matchState': 'SHOW_RESULT' });
                
                setTimeout(async () => {
                    const currentLives = roomData.players[loserId].lives;
                    const newLives = currentLives - 1;
                    const isDead = newLives === 0;

                    const updates = { [`players.${loserId}.lives`]: newLives };
                    
                    if (isDead) {
                        updates[`players.${loserId}.eliminatedInRound`] = roundNum;
                        const aliveCount = Object.values(roomData.players).filter(p => p.lives > 0).length;
                        updates[`players.${loserId}.placement`] = aliveCount; 
                        
                        if (roomData.config.isCompetitive) {
                            const rrChange = calculateRRChange(aliveCount);
                            updates[`players.${loserId}.rrChange`] = rrChange;

                            if (roomData.players[loserId].isBot) {
                                const botRealName = roomData.players[loserId].originalBotName;
                                const currentBotRR = roomData.players[loserId].rr || 200;
                                const newBotRR = Math.max(0, currentBotRR + rrChange);
                                setDoc(doc(db, "competitive_bots", botRealName), { rr: newBotRR }, { merge: true }).catch(console.error);
                            }
                        }
                    }

                    await updateRoom(updates);

                    const newPlayers = { ...roomData.players };
                    newPlayers[loserId].lives = newLives;
                    if (isDead) {
                        newPlayers[loserId].eliminatedInRound = roundNum;
                        newPlayers[loserId].placement = updates[`players.${loserId}.placement`];
                        if (updates[`players.${loserId}.rrChange`] !== undefined) {
                            newPlayers[loserId].rrChange = updates[`players.${loserId}.rrChange`];
                        }
                    }

                    const simulatedData = { ...roomData, players: newPlayers };
                    setTimeout(() => startNewRound(simulatedData), 2000);
                }, 1500);
            };

            // --- ANIMAZIONE ROULETTE E TRANSIZIONE INIZIALE ---
            useEffect(() => {
                if (roomData?.state === 'ARENA' && roomData.arena.matchState === 'CHOOSING_CHALLENGERS') {
                    const alive = Object.values(roomData.players).filter(p => p.lives > 0).map(p => p.id);
                    if (alive.length < 2) return;
                    
                    const interval = setInterval(() => {
                        const r1 = alive[Math.floor(Math.random() * alive.length)];
                        let r2 = alive[Math.floor(Math.random() * alive.length)];
                        while(r2 === r1 && alive.length > 1) r2 = alive[Math.floor(Math.random() * alive.length)];
                        setRouletteIds([r1, r2]);
                    }, 150);
                    
                    return () => clearInterval(interval);
                } else {
                    setRouletteIds([]);
                }
            }, [roomData?.state, roomData?.arena?.matchState, roomData?.players]);

            useEffect(() => {
                if (!isHost || !roomData || roomData.state !== 'ARENA' || roomData.arena.matchState !== 'CHOOSING_CHALLENGERS') return;
                const timer = setTimeout(() => { updateRoom({ 'arena.matchState': 'WAITING_ACTION' }); }, 3000); 
                return () => clearTimeout(timer);
            }, [isHost, roomData?.state, roomData?.arena?.matchState]);

            // --- LOGICA DADI ---
            const rollMyDice = async (cId) => {
                if (roomData.arena.rolls[cId]) return;
                await updateRoom({ [`arena.rolls.${cId}`]: 'ROLLING' });
                setTimeout(async () => {
                    await updateRoom({ [`arena.rolls.${cId}`]: { result: Math.floor(Math.random() * 6) + 1 } });
                }, 1000);
            };

            useEffect(() => {
                if (!isHost || !roomData || roomData.state !== 'ARENA' || roomData.arena.matchState !== 'WAITING_ACTION' || roomData.arena.minigame !== 'DICE') return;
                
                const cIds = roomData.arena.challengerIds;
                cIds.forEach(cId => {
                    const p = roomData.players[cId];
                    if (p && p.isBot && roomData.arena.rolls[cId] === undefined) {
                        updateRoom({ [`arena.rolls.${cId}`]: 'PRE_ROLL' }); 
                        setTimeout(() => {
                            updateRoom({ [`arena.rolls.${cId}`]: 'ROLLING' });
                            setTimeout(() => {
                                updateRoom({ [`arena.rolls.${cId}`]: { result: Math.floor(Math.random() * 6) + 1 } });
                            }, 1000);
                        }, 500 + Math.random() * 1500);
                    }
                });
            }, [roomData]);

            useEffect(() => {
                if (!isHost || !roomData || roomData.state !== 'ARENA' || roomData.arena.matchState !== 'WAITING_ACTION' || roomData.arena.minigame !== 'DICE') return;

                const cIds = roomData.arena.challengerIds;
                if (cIds.length === 2) {
                    const roll1 = roomData.arena.rolls[cIds[0]];
                    const roll2 = roomData.arena.rolls[cIds[1]];

                    if (roll1?.result !== undefined && roll2?.result !== undefined) {
                        const r1 = roll1.result;
                        const r2 = roll2.result;
                        let loserId = null;
                        if (r1 < r2) loserId = cIds[0];
                        else if (r2 < r1) loserId = cIds[1];

                        if (loserId) {
                            handleLoser(loserId, roomData.arena.round);
                        } else {
                            if (handledRoundRef.current === roomData.arena.round) return;
                            handledRoundRef.current = roomData.arena.round;

                            updateRoom({ 'arena.matchState': 'SHOW_RESULT' });
                            setTimeout(() => startNewRound(roomData), 2000);
                        }
                    }
                }
            }, [roomData]);

            // --- LOGICA CAMPO MINATO ---
            const clickMinesweeperTile = async (idx) => {
                if (roomData.arena.minigame !== 'MINESWEEPER' || roomData.arena.matchState !== 'WAITING_ACTION') return;
                const ms = roomData.arena.minesweeper;
                
                if (ms.turn !== user.uid) return;
                if (ms.board[idx].revealedBy !== null) return;

                const isBomb = ms.board[idx].hasBomb;
                const board = [...ms.board];
                board[idx] = { hasBomb: isBomb, revealedBy: user.uid };

                const newBombsFound = { ...ms.bombsFound };
                if (isBomb) newBombsFound[user.uid]++;

                let nextTurn = user.uid;
                if (newBombsFound[user.uid] < 2) {
                    nextTurn = user.uid === roomData.arena.challengerIds[0] ? roomData.arena.challengerIds[1] : roomData.arena.challengerIds[0];
                }

                await updateRoom({
                    'arena.minesweeper.board': board,
                    'arena.minesweeper.bombsFound': newBombsFound,
                    'arena.minesweeper.turn': nextTurn,
                    'arena.minesweeper.moveCount': ms.moveCount + 1
                });
            };

            useEffect(() => {
                if (!isHost || !roomData || roomData.state !== 'ARENA' || roomData.arena.matchState !== 'WAITING_ACTION' || roomData.arena.minigame !== 'MINESWEEPER') return;

                const ms = roomData.arena.minesweeper;
                const turnId = ms.turn;
                const p = roomData.players[turnId];

                if (p && p.isBot && botMoveCountRef.current !== `ms_${ms.moveCount}` && ms.bombsFound[turnId] < 2) {
                    botMoveCountRef.current = `ms_${ms.moveCount}`;

                    setTimeout(() => {
                        const board = [...ms.board];
                        const unrevealed = board.map((c, i) => c.revealedBy === null ? i : -1).filter(i => i !== -1);
                        
                        if (unrevealed.length > 0) {
                            const choice = unrevealed[Math.floor(Math.random() * unrevealed.length)];
                            const isBomb = board[choice].hasBomb;
                            board[choice] = { hasBomb: isBomb, revealedBy: turnId };

                            const newBombsFound = { ...ms.bombsFound };
                            if (isBomb) newBombsFound[turnId]++;

                            let nextTurn = turnId;
                            if (newBombsFound[turnId] < 2) {
                                nextTurn = turnId === roomData.arena.challengerIds[0] ? roomData.arena.challengerIds[1] : roomData.arena.challengerIds[0];
                            }

                            updateRoom({
                                'arena.minesweeper.board': board,
                                'arena.minesweeper.bombsFound': newBombsFound,
                                'arena.minesweeper.turn': nextTurn,
                                'arena.minesweeper.moveCount': ms.moveCount + 1
                            });
                        }
                    }, 1000 + Math.random() * 1000);
                }
            }, [roomData]);

            useEffect(() => {
                if (!isHost || !roomData || roomData.state !== 'ARENA' || roomData.arena.matchState !== 'WAITING_ACTION' || roomData.arena.minigame !== 'MINESWEEPER') return;
                
                const ms = roomData.arena.minesweeper;
                const cIds = roomData.arena.challengerIds;
                
                if (ms.bombsFound[cIds[0]] >= 2) {
                    handleLoser(cIds[0], roomData.arena.round);
                } else if (ms.bombsFound[cIds[1]] >= 2) {
                    handleLoser(cIds[1], roomData.arena.round);
                }
            }, [roomData]);

            // --- LOGICA SIMON SAYS ---
            
            // Animazione Locale Simon (Client-side)
            useEffect(() => {
                if (roomData?.state === 'ARENA' && roomData.arena.minigame === 'SIMONSAYS' && roomData.arena.matchState === 'WAITING_ACTION') {
                    const ss = roomData.arena.simonsays;
                    if (ss && ss.phase === 'WATCH') {
                        let step = 0;
                        const interval = setInterval(() => {
                            if (step < ss.sequence.length) {
                                setSimonLit(ss.sequence[step]);
                                setTimeout(() => setSimonLit(null), 400); // 400ms acceso
                                step++;
                            } else {
                                clearInterval(interval);
                            }
                        }, 800); // Passo di 800ms
                        
                        return () => {
                            clearInterval(interval);
                            setSimonLit(null);
                        };
                    } else {
                        setSimonLit(null);
                    }
                }
            }, [roomData?.arena?.simonsays?.phase, roomData?.arena?.simonsays?.sequence?.length, roomData?.arena?.matchState]);

            // Host gestisce Fasi e Bot per Simon
            useEffect(() => {
                if (!isHost || !roomData || roomData.state !== 'ARENA' || roomData.arena.matchState !== 'WAITING_ACTION' || roomData.arena.minigame !== 'SIMONSAYS') return;
                const ss = roomData.arena.simonsays;
                if (!ss) return;

                // 1. Passaggio da WATCH a PLAY
                if (ss.phase === 'WATCH') {
                    const totalWait = (ss.sequence.length * 800) + 1000;
                    const timer = setTimeout(() => {
                        updateRoom({ 'arena.simonsays.phase': 'PLAY' });
                    }, totalWait);
                    return () => clearTimeout(timer);
                }

                // 2. Controllo Completamento Livello (Tutti hanno finito)
                if (ss.phase === 'PLAY') {
                    const cIds = roomData.arena.challengerIds;
                    
                    if (ss.progress[cIds[0]] >= ss.sequence.length && ss.progress[cIds[1]] >= ss.sequence.length) {
                        const nextSeq = [...ss.sequence, Math.floor(Math.random() * 4)];
                        setTimeout(() => {
                            updateRoom({
                                'arena.simonsays.sequence': nextSeq,
                                'arena.simonsays.phase': 'WATCH',
                                'arena.simonsays.progress': { [cIds[0]]: 0, [cIds[1]]: 0 }
                            });
                        }, 1000);
                        return; // Non far giocare i bot se stiamo passando di livello
                    }

                    // 3. Logica IA BOT
                    cIds.forEach(cId => {
                        const p = roomData.players[cId];
                        const currentProg = ss.progress[cId] || 0;
                        
                        if (p && p.isBot && currentProg < ss.sequence.length) {
                            const refKey = `simon_${cId}_${currentProg}_${ss.sequence.length}`;
                            
                            if (botMoveCountRef.current !== refKey) {
                                botMoveCountRef.current = refKey;

                                setTimeout(() => {
                                    // Rileggi dati in caso di fine round improvvisa
                                    if (roomData.arena.matchState !== 'WAITING_ACTION') return;

                                    const correctColor = ss.sequence[currentProg];
                                    
                                    // Intelligenza: probabilità di sbagliare aumenta con la lunghezza della sequenza.
                                    // Formula: 2% base + 3% per ogni elemento della sequenza totale attuale.
                                    const failChance = 0.02 + (ss.sequence.length * 0.03); 
                                    
                                    let chosenColor = correctColor;
                                    if (Math.random() < failChance) {
                                        // Errore del Bot!
                                        chosenColor = (correctColor + Math.floor(Math.random() * 3) + 1) % 4;
                                    }

                                    if (chosenColor === correctColor) {
                                        updateRoom({ [`arena.simonsays.progress.${cId}`]: currentProg + 1 });
                                    } else {
                                        handleLoser(cId, roomData.arena.round);
                                    }
                                }, 700 + Math.random() * 600); // Tempo di reazione bot per premere un tasto
                            }
                        }
                    });
                }
            }, [roomData]);

            // Giocatore Reale clicca un colore
            const clickSimonColor = async (idx) => {
                if (roomData.arena.minigame !== 'SIMONSAYS' || roomData.arena.matchState !== 'WAITING_ACTION') return;
                const ss = roomData.arena.simonsays;
                
                if (ss.phase !== 'PLAY') return;
                if (!roomData.arena.challengerIds.includes(user.uid)) return; // Non è in gioco

                const myProg = ss.progress[user.uid] || 0;
                if (myProg >= ss.sequence.length) return; // Ha già finito la sequenza di questo turno

                // Feedback visivo immediato per l'utente
                setSimonLit(idx);
                setTimeout(() => setSimonLit(null), 200);

                if (idx === ss.sequence[myProg]) {
                    // Corretto!
                    await updateRoom({ [`arena.simonsays.progress.${user.uid}`]: myProg + 1 });
                } else {
                    // Sbagliato, ha perso la vita
                    handleLoser(user.uid, roomData.arena.round);
                }
            };


            const leaveRoom = () => {
                if (arenaStartTimeRef.current) arenaStartTimeRef.current = null;
                setMyRRChange(null);
                setRoomId(null);
                setRoomData(null);
                setUiState('MAIN_MENU');
            };

            // --- HELPER UI ---
            const formatTime = (seconds) => {
                if (!seconds) return "0 min";
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                if (h > 0) return `${h}h ${m}m`;
                return `${m} min`;
            };

            let favChar = null;
            let favCount = 0;
            if (userStats?.characterUsage) {
                Object.entries(userStats.characterUsage).forEach(([charId, count]) => {
                    if (count > favCount) {
                        favCount = count;
                        favChar = CHARACTERS.find(c => c.id === charId);
                    }
                });
            }

            // --- SCHERMATE UI BASE ---

            if (uiState === 'LOADING') {
                return <div className="flex h-full items-center justify-center"><div className="w-16 h-16 border-4 border-yellow-400 border-t-transparent rounded-full animate-spin"></div></div>;
            }

            if (uiState === 'ERROR') {
                return (
                    <div className="flex flex-col h-full items-center justify-center space-y-4 p-8 text-center relative z-10">
                        <X className="w-20 h-20 text-red-500 animate-bounce" />
                        <h1 className="text-3xl font-bold text-white">Ops, qualcosa è andato storto!</h1>
                        <p className="text-slate-400 max-w-md">{errorMsg}</p>
                    </div>
                );
            }

            if (!roomId || !roomData) {
                // MENU PRINCIPALE
                return (
                    <div className="relative z-10 h-full w-full flex flex-col items-center justify-center space-y-6 overflow-y-auto py-8">
                        {errorMsg && (
                            <div className="absolute top-10 bg-red-500 text-white px-6 py-3 rounded-xl shadow-2xl font-bold animate-in slide-in-from-top flex items-center gap-2 z-50">
                                <X className="w-5 h-5"/> {errorMsg}
                            </div>
                        )}
                        <div className="fixed inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: `linear-gradient(to right, #ffffff 1px, transparent 1px), linear-gradient(to bottom, #ffffff 1px, transparent 1px)`, backgroundSize: '40px 40px' }}></div>
                        <div className="fixed inset-0 bg-[radial-gradient(circle_at_center,_transparent_0%,_#0f172a_100%)] pointer-events-none"></div>

                        {uiState === 'NAME_INPUT' && (
                            <div className="bg-slate-800/80 p-8 rounded-3xl border border-slate-600 shadow-2xl backdrop-blur-sm text-center max-w-md w-full animate-in zoom-in z-10 mx-4">
                                <Dices className="w-20 h-20 mx-auto text-yellow-400 mb-4 animate-bounce" />
                                <h1 className="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500 mb-2">Arena Party</h1>
                                <p className="text-slate-300 mb-8 text-sm">Sopravvivi ai minigiochi online!</p>
                                <input 
                                    type="text" 
                                    value={playerName}
                                    onChange={(e) => setPlayerName(e.target.value)}
                                    placeholder="Inserisci il tuo nome..." 
                                    className="w-full bg-slate-900 border-2 border-slate-600 rounded-xl px-4 py-3 text-white text-lg focus:outline-none focus:border-yellow-400 mb-6 text-center"
                                    maxLength={15}
                                />
                                <button 
                                    onClick={() => playerName.trim() && setUiState('MAIN_MENU')}
                                    disabled={!playerName.trim()}
                                    className="w-full bg-gradient-to-r from-yellow-500 to-orange-600 text-white font-bold py-3 px-6 rounded-xl transform transition hover:scale-105 active:scale-95 disabled:opacity-50"
                                >Gioca Ora</button>
                            </div>
                        )}

                        {uiState === 'MAIN_MENU' && (
                            <div className="flex flex-col items-center justify-center animate-in slide-in-from-bottom-8 z-10 w-full px-4 max-w-4xl">
                                <h2 className="text-3xl font-bold text-white mb-6 text-center">Bentornato, {playerName}!</h2>
                                
                                {/* DASHBOARD STATISTICHE E RANK */}
                                {userStats && (() => {
                                    const currentRR = userStats.rr || 0;
                                    const rankInfo = getRank(currentRR);
                                    const nextRank = RANKS.find(r => r.minRR > currentRR);
                                    const progress = nextRank ? ((currentRR - rankInfo.minRR) / (nextRank.minRR - rankInfo.minRR)) * 100 : 100;

                                    return (
                                        <div className="w-full mb-8 bg-slate-800/80 p-6 rounded-3xl border border-slate-600 shadow-xl backdrop-blur-sm relative overflow-hidden">
                                            <div className="absolute -right-10 -top-10 opacity-5 pointer-events-none"><Activity className="w-40 h-40" /></div>
                                            <h3 className="text-white font-bold text-lg mb-4 flex items-center gap-2"><Activity className="text-yellow-400 w-5 h-5"/> Profilo & Statistiche</h3>
                                            
                                            {/* RANK SUMMARY */}
                                            <div className="bg-slate-900/80 p-6 rounded-2xl flex flex-col items-center justify-center border border-slate-700 shadow-inner mb-6 w-full relative overflow-hidden">
                                                <div className={`absolute left-4 top-1/2 -translate-y-1/2 opacity-10`}><Medal className="w-24 h-24" /></div>
                                                <div className={`absolute right-4 top-1/2 -translate-y-1/2 opacity-10`}><Medal className="w-24 h-24" /></div>
                                                
                                                <span className={`text-3xl md:text-4xl font-black ${rankInfo.text} uppercase tracking-widest drop-shadow-md z-10`}>{rankInfo.name}</span>
                                                <span className="text-slate-300 font-bold mt-2 z-10 text-lg">{currentRR} RR</span>
                                                
                                                {nextRank ? (
                                                    <div className="w-full max-w-sm bg-slate-800 rounded-full h-3 mt-4 overflow-hidden border border-slate-700 z-10 shadow-inner">
                                                        <div className={`h-full ${rankInfo.bg} transition-all duration-1000 ease-out`} style={{width: `${progress}%`}}></div>
                                                    </div>
                                                ) : (
                                                    <span className="text-sm text-fuchsia-400 font-bold mt-3 z-10 uppercase tracking-widest animate-pulse">Rank Massimo Raggiunto!</span>
                                                )}
                                            </div>

                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                                <div className="bg-slate-900/80 p-4 rounded-2xl flex flex-col items-center justify-center border border-slate-700 shadow-inner">
                                                    <Gamepad2 className="text-sky-400 mb-1 w-6 h-6"/>
                                                    <span className="text-2xl font-black text-white">{userStats.gamesPlayed || 0}</span>
                                                    <span className="text-[10px] text-slate-400 uppercase font-bold text-center mt-1">Partite Giocate</span>
                                                </div>
                                                <div className="bg-slate-900/80 p-4 rounded-2xl flex flex-col items-center justify-center border border-slate-700 shadow-inner">
                                                    <Trophy className="text-yellow-400 mb-1 w-6 h-6"/>
                                                    <span className="text-2xl font-black text-white">{userStats.wins || 0}</span>
                                                    <span className="text-[10px] text-slate-400 uppercase font-bold text-center mt-1">Vittorie</span>
                                                </div>
                                                <div className="bg-slate-900/80 p-4 rounded-2xl flex flex-col items-center justify-center border border-slate-700 shadow-inner">
                                                    <Clock className="text-emerald-400 mb-1 w-6 h-6"/>
                                                    <span className="text-xl font-black text-white">{formatTime(userStats.timePlayedSeconds)}</span>
                                                    <span className="text-[10px] text-slate-400 uppercase font-bold text-center mt-1">Tempo in Gioco</span>
                                                </div>
                                                <div className="bg-slate-900/80 p-4 rounded-2xl flex flex-col items-center justify-center border border-slate-700 shadow-inner overflow-hidden">
                                                    {favChar ? (
                                                        <>
                                                            <img src={favChar.img} className="w-8 h-8 rounded-full object-cover border-2 border-pink-400 shadow-md"/>
                                                            <span className="text-[10px] font-black text-white truncate w-full text-center mt-1">{favChar.name}</span>
                                                        </>
                                                    ) : (
                                                        <>
                                                            <Star className="text-pink-400 mb-1 w-6 h-6"/>
                                                            <span className="text-xl font-black text-slate-500">-</span>
                                                        </>
                                                    )}
                                                    <span className="text-[10px] text-slate-400 uppercase font-bold text-center mt-1">Preferito</span>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })()}

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                                    <button 
                                        onClick={() => setUiState('LOBBY_CREATE')}
                                        className="bg-slate-800 border-2 border-yellow-500/50 p-8 rounded-3xl flex flex-col items-center justify-center group hover:-translate-y-2 transition-all shadow-xl"
                                    >
                                        <div className="bg-yellow-500/20 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform"><Plus className="w-12 h-12 text-yellow-400" /></div>
                                        <span className="text-xl font-bold text-white mb-2">Crea Partita</span>
                                        <span className="text-sm text-slate-400 text-center">Ospita una stanza multiplayer</span>
                                    </button>
                                    <button 
                                        onClick={() => setUiState('JOIN_MODAL')}
                                        className="bg-slate-800 border-2 border-sky-500/50 p-8 rounded-3xl flex flex-col items-center justify-center group hover:-translate-y-2 transition-all shadow-xl"
                                    >
                                        <div className="bg-sky-500/20 p-4 rounded-full mb-4 group-hover:scale-110 transition-transform"><Hash className="w-12 h-12 text-sky-400" /></div>
                                        <span className="text-xl font-bold text-white mb-2">Unisciti</span>
                                        <span className="text-sm text-slate-400 text-center">Entra tramite Codice Stanza</span>
                                    </button>
                                </div>
                                <button onClick={() => setUiState('NAME_INPUT')} className="mt-8 text-slate-400 underline">Cambia Nome</button>
                            </div>
                        )}

                        {uiState === 'LOBBY_CREATE' && (
                             <div className="bg-slate-800/90 p-8 rounded-3xl border border-slate-600 shadow-2xl w-full max-w-md z-10 mx-4">
                                <h2 className="text-2xl font-bold text-white mb-6 flex items-center gap-2"><Settings className="text-yellow-400"/> Crea Stanza</h2>
                                <div className="mb-6">
                                    <label className="block text-sm text-slate-300 mb-2">Modalità di Gioco</label>
                                    <div className="flex gap-2">
                                        <button onClick={() => setLobbyConfig({...lobbyConfig, isCompetitive: false})} className={`flex-1 py-3 rounded-xl font-bold transition-all ${!lobbyConfig.isCompetitive ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'}`}>Amichevole</button>
                                        <button onClick={() => setLobbyConfig({...lobbyConfig, isCompetitive: true, maxPlayers: 8, startingLives: 3})} className={`flex-1 py-3 rounded-xl font-bold flex items-center justify-center gap-2 transition-all ${lobbyConfig.isCompetitive ? 'bg-rose-600 text-white shadow-[0_0_15px_rgba(225,29,72,0.5)]' : 'bg-slate-700 text-slate-400 hover:bg-slate-600'}`}><Swords className="w-5 h-5"/> Competitiva</button>
                                    </div>
                                </div>
                                <div className="mb-6">
                                    <label className="block text-sm text-slate-300 mb-2">Numero Sfidanti: {lobbyConfig.maxPlayers}</label>
                                    <input type="range" min="2" max="8" value={lobbyConfig.maxPlayers} onChange={(e) => !lobbyConfig.isCompetitive && setLobbyConfig({...lobbyConfig, maxPlayers: parseInt(e.target.value)})} className={`w-full accent-yellow-400 ${lobbyConfig.isCompetitive ? 'opacity-50 cursor-not-allowed' : ''}`} disabled={lobbyConfig.isCompetitive} />
                                </div>
                                <div className="mb-8">
                                    <label className="block text-sm text-slate-300 mb-2">Vite Iniziali: {lobbyConfig.startingLives}</label>
                                    <input type="range" min="1" max="5" value={lobbyConfig.startingLives} onChange={(e) => !lobbyConfig.isCompetitive && setLobbyConfig({...lobbyConfig, startingLives: parseInt(e.target.value)})} className={`w-full accent-red-500 ${lobbyConfig.isCompetitive ? 'opacity-50 cursor-not-allowed' : ''}`} disabled={lobbyConfig.isCompetitive} />
                                    <div className="flex justify-between text-xs text-slate-500 mt-1">
                                        <span>1 Cuore</span><span>5 Cuori</span>
                                    </div>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setUiState('MAIN_MENU')} className="flex-1 py-3 bg-slate-700 text-white rounded-xl">Annulla</button>
                                    <button onClick={createRoom} className="flex-1 py-3 bg-yellow-500 text-slate-900 font-bold rounded-xl shadow-[0_0_15px_rgba(234,179,8,0.4)]">Avvia Lobby</button>
                                </div>
                             </div>
                        )}

                        {uiState === 'JOIN_MODAL' && (
                             <div className="bg-slate-800/90 p-8 rounded-3xl border border-slate-600 shadow-2xl w-full max-w-md z-10 mx-4 text-center">
                                <Hash className="w-16 h-16 mx-auto text-sky-400 mb-4" />
                                <h2 className="text-2xl font-bold text-white mb-6">Inserisci Codice</h2>
                                <input 
                                    type="text" 
                                    value={joinCode}
                                    onChange={(e) => setJoinCode(e.target.value.toUpperCase())}
                                    placeholder="Es. AB12CD" 
                                    className="w-full bg-slate-900 border-2 border-slate-600 rounded-xl px-4 py-3 text-white text-2xl tracking-widest uppercase focus:border-sky-400 mb-6 text-center"
                                    maxLength={6}
                                />
                                <div className="flex gap-4">
                                    <button onClick={() => setUiState('MAIN_MENU')} className="flex-1 py-3 bg-slate-700 text-white rounded-xl">Indietro</button>
                                    <button onClick={joinRoom} disabled={!joinCode} className="flex-1 py-3 bg-sky-500 text-white font-bold rounded-xl disabled:opacity-50">Entra</button>
                                </div>
                             </div>
                        )}
                    </div>
                );
            }

            // --- UI NELLA STANZA ---
            const me = roomData.players[user.uid];
            const playersList = Object.values(roomData.players);
            
            const humanPlayers = playersList.filter(p => !p.isBot);
            const allHumansReady = humanPlayers.length > 0 && humanPlayers.every(p => p.isReady);

            const alivePlayers = playersList.filter(p => p.lives > 0);
            const deadPlayers = playersList.filter(p => p.lives === 0).sort((a, b) => (b.eliminatedInRound || 0) - (a.eliminatedInRound || 0));
            const maxGameLives = roomData.config.startingLives || 4;

            // Componenti Cuori
            const Hearts = ({ count, max = 4 }) => (
                <div className="flex gap-0.5">
                    {[...Array(max)].map((_, i) => (
                    i < count 
                        ? <Heart key={i} className="w-3 h-3 md:w-3.5 md:h-3.5 text-red-500 fill-red-500 drop-shadow-[0_0_3px_rgba(239,68,68,0.8)]" /> 
                        : <HeartCrack key={i} className="w-3 h-3 md:w-3.5 md:h-3.5 text-slate-700" />
                    ))}
                </div>
            );

            const BigHearts = ({ count, max = 4 }) => (
                <div className="flex gap-1">
                    {[...Array(max)].map((_, i) => (
                    i < count 
                        ? <Heart key={i} className="w-5 h-5 text-red-500 fill-red-500 drop-shadow-[0_0_5px_rgba(239,68,68,0.8)]" /> 
                        : <HeartCrack key={i} className="w-5 h-5 text-slate-700" />
                    ))}
                </div>
            );

            // RENDER COMBATTENTE ARENA
            const renderFighter = (cId, index, isChoosing) => {
                const p = roomData.players[cId];
                if (!p) return null;

                const char = CHARACTERS.find(c => c.id === p.characterId);
                const isMe = cId === user.uid;
                
                let isLoser = false;
                let isWinner = false;

                if (roomData.arena.matchState === 'SHOW_RESULT' && !isChoosing && roomData.arena.challengerIds.includes(cId)) {
                    if (roomData.arena.minigame === 'DICE') {
                        const r1 = roomData.arena.rolls[roomData.arena.challengerIds[0]]?.result;
                        const r2 = roomData.arena.rolls[roomData.arena.challengerIds[1]]?.result;
                        if (r1 !== undefined && r2 !== undefined) {
                            const myResult = index === 0 ? r1 : r2;
                            const otherResult = index === 0 ? r2 : r1;
                            if (myResult < otherResult) isLoser = true;
                            if (myResult > otherResult) isWinner = true;
                        }
                    } else if (roomData.arena.minigame === 'MINESWEEPER') {
                        if (roomData.arena.minesweeper.bombsFound[cId] >= 2) isLoser = true;
                        else isWinner = true;
                    } else if (roomData.arena.minigame === 'SIMONSAYS') {
                        // Simon Says Winner logic handled in handleLoser trigger, 
                        // But for visual feedback: loser is the one whose progress stopped and the round is SHOW_RESULT.
                        // However, we don't have explicit "winner" tracking in state before removing life. Let's just trust isLoser class later if needed.
                        const myProg = roomData.arena.simonsays?.progress[cId];
                        const otherProg = roomData.arena.simonsays?.progress[roomData.arena.challengerIds[index === 0 ? 1 : 0]];
                        if (myProg < otherProg) isLoser = true;
                        else if (myProg > otherProg) isWinner = true;
                    }
                }

                return (
                    <div key={cId + index} className={`flex flex-col items-center gap-2 md:gap-4 transition-all duration-300 ${isLoser ? 'opacity-50 scale-90 blur-[2px]' : isWinner ? 'scale-110 drop-shadow-[0_0_30px_rgba(255,255,255,0.3)]' : ''} ${isChoosing ? 'scale-105 opacity-80' : ''}`}>
                        <div className="bg-slate-800/90 px-4 md:px-6 py-1.5 md:py-2 rounded-full border border-slate-600 flex flex-col items-center min-h-[50px] md:min-h-[64px] min-w-[100px] md:min-w-[120px]">
                            <span className={`font-bold text-sm md:text-lg ${isMe ? 'text-yellow-400' : 'text-white'} flex flex-col md:flex-row items-center md:gap-2`}>
                                {p.name}
                                {roomData.config.isCompetitive && <RankBadge rr={p.rr} />}
                            </span>
                            <div className="mt-1"><BigHearts count={p.lives} max={maxGameLives} /></div>
                        </div>
                        
                        <div className={`relative w-28 h-28 md:w-56 md:h-56 lg:w-64 lg:h-64 rounded-2xl md:rounded-3xl flex items-center justify-center border-4 ${char ? char.color : 'border-slate-500'} border-white/20 shadow-2xl overflow-hidden p-1.5 md:p-2`}>
                            {char && <img src={char.img} className={`w-full h-full object-cover rounded-xl md:rounded-2xl z-10 transition-transform ${isWinner ? 'animate-bounce' : ''}`} />}
                            {isLoser && <div className="absolute inset-0 bg-red-600/60 z-20 flex items-center justify-center animate-in zoom-in"><span className="text-2xl md:text-4xl font-black text-white rotate-[-15deg] drop-shadow-lg">-1 VITA</span></div>}
                        </div>

                        <div className="h-16 md:h-20 flex items-center justify-center w-full">
                            {/* ESTREZIONE IN CORSO */}
                            {isChoosing && <div className="animate-pulse text-slate-400 font-bold uppercase tracking-widest text-sm bg-slate-800 px-4 py-2 rounded-xl">Estrazione...</div>}

                            {/* UI DADI */}
                            {roomData.arena.minigame === 'DICE' && !isChoosing && (() => {
                                const rollData = roomData.arena.rolls[cId];
                                const isRolling = rollData === 'ROLLING';
                                const hasFinishedRoll = typeof rollData === 'object' && rollData.result !== undefined;

                                return (
                                    <>
                                        {(!rollData || rollData === 'PRE_ROLL') && isMe && roomData.arena.matchState === 'WAITING_ACTION' && (
                                            <button 
                                                onClick={() => rollMyDice(cId)}
                                                className="bg-gradient-to-r from-yellow-400 to-orange-500 text-slate-900 font-black text-sm md:text-xl px-6 md:px-8 py-2 md:py-3 rounded-xl shadow-lg flex items-center gap-2 transform hover:scale-105 animate-bounce"
                                            ><Dices className="w-5 h-5 md:w-6 md:h-6" /> TIRA!</button>
                                        )}
                                        {(!rollData || rollData === 'PRE_ROLL') && !isMe && roomData.arena.matchState === 'WAITING_ACTION' && (
                                            <div className="border-4 border-dashed border-slate-600 rounded-2xl px-6 py-2 flex flex-col items-center justify-center animate-pulse text-slate-500 font-bold text-[10px] uppercase">
                                                <Dices className="w-5 h-5 md:w-6 md:h-6 mb-1"/> ATTESA
                                            </div>
                                        )}
                                        {isRolling && <div className="w-16 h-16 md:w-20 md:h-20 bg-white rounded-2xl flex items-center justify-center shadow-xl text-slate-900 text-4xl md:text-5xl font-black animate-[spin_0.2s_linear_infinite]">?</div>}
                                        {hasFinishedRoll && <div className="w-16 h-16 md:w-20 md:h-20 bg-white rounded-2xl flex items-center justify-center shadow-xl text-slate-900 text-4xl md:text-5xl font-black animate-in zoom-in-50">{rollData.result}</div>}
                                    </>
                                );
                            })()}

                            {/* UI CAMPO MINATO */}
                            {roomData.arena.minigame === 'MINESWEEPER' && !isChoosing && (
                                <div className="flex flex-col items-center gap-1">
                                    <span className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest">Bombe Trovate</span>
                                    <div className="flex gap-2 bg-slate-800 px-4 py-1.5 rounded-full border border-slate-700 shadow-inner">
                                        <Bomb className={`w-5 h-5 md:w-6 md:h-6 ${roomData.arena.minesweeper.bombsFound[cId] >= 1 ? 'text-red-500 animate-bounce' : 'text-slate-600'}`} />
                                        <Bomb className={`w-5 h-5 md:w-6 md:h-6 ${roomData.arena.minesweeper.bombsFound[cId] >= 2 ? 'text-red-500 animate-bounce' : 'text-slate-600'}`} />
                                    </div>
                                </div>
                            )}

                            {/* UI SIMON SAYS */}
                            {roomData.arena.minigame === 'SIMONSAYS' && !isChoosing && (
                                <div className="flex flex-col items-center gap-1 w-full px-4">
                                    <span className="text-[10px] md:text-xs font-bold text-slate-400 uppercase tracking-widest">Memoria ({roomData.arena.simonsays?.sequence?.length || 0})</span>
                                    <div className="flex gap-1">
                                        {Array.from({ length: roomData.arena.simonsays?.sequence?.length || 0 }).map((_, i) => (
                                            <div key={i} className={`w-2 h-2 md:w-3 md:h-3 rounded-full ${i < (roomData.arena.simonsays?.progress[cId] || 0) ? 'bg-emerald-400 shadow-[0_0_5px_rgba(52,211,153,0.8)]' : 'bg-slate-700'}`} />
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="relative z-10 h-full w-full flex flex-col bg-slate-900">
                    <div className="fixed inset-0 opacity-10 pointer-events-none" style={{ backgroundImage: `linear-gradient(to right, #ffffff 1px, transparent 1px), linear-gradient(to bottom, #ffffff 1px, transparent 1px)`, backgroundSize: '40px 40px' }}></div>
                    <div className="fixed inset-0 bg-[radial-gradient(circle_at_center,_transparent_0%,_#0f172a_100%)] pointer-events-none"></div>

                    {/* TOP BAR */}
                    <div className="absolute top-0 left-0 right-0 p-2 md:p-3 flex items-center justify-between z-30 bg-slate-900/95 border-b border-slate-700/50 shadow-lg">
                        <div className="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-600 shrink-0">
                            <span className="text-slate-400 text-[10px] md:text-xs uppercase font-bold flex items-center gap-1">
                                {roomData.config.isCompetitive ? <><Swords className="w-3 h-3 text-rose-400"/> <span className="text-rose-400">Comp.</span></> : <span>Amich.</span>}
                            </span>
                            <span className="text-white font-mono font-bold tracking-widest text-sm border-l border-slate-600 pl-2 ml-1">{roomId}</span>
                        </div>
                        
                        <div className="flex-1 flex gap-2 md:gap-4 overflow-x-auto custom-scrollbar px-4 justify-center">
                            {alivePlayers.map(p => {
                                const isFighting = roomData.state === 'ARENA' && roomData.arena.challengerIds.includes(p.id);
                                const cInfo = CHARACTERS.find(c => c.id === p.characterId);
                                
                                return (
                                    <div key={p.id} className={`flex flex-col items-center shrink-0 transition-all ${isFighting ? 'scale-110 drop-shadow-[0_0_15px_rgba(250,204,21,0.5)] z-10' : 'scale-95'}`}>
                                        <div className={`bg-slate-800 border-2 ${isFighting ? 'border-yellow-400' : 'border-slate-600'} rounded-xl p-1.5 flex flex-col items-center w-20 md:w-24 shadow-lg transition-colors`}>
                                            {cInfo ? <img src={cInfo.img} className="w-10 h-10 md:w-12 md:h-12 object-cover rounded-lg mb-1 shadow-md" /> : <User className="w-8 h-8 text-slate-500 mb-1" />}
                                            <span className="text-[9px] md:text-[10px] font-bold text-white truncate w-full text-center uppercase tracking-wider mb-0.5">{p.name}</span>
                                            {roomData.config.isCompetitive && <div className="mb-1"><RankBadge rr={p.rr} /></div>}
                                            <Hearts count={p.lives} max={maxGameLives} />
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <button onClick={leaveRoom} className="text-red-400 hover:text-red-300 text-xs font-bold bg-slate-800 px-3 py-2 rounded-lg border border-red-900/50 shrink-0">Esci</button>
                    </div>

                    <div className="flex-1 flex flex-row pt-[90px] md:pt-[100px] pb-4 px-2 md:px-4 w-full relative z-10 h-full overflow-hidden">
                        
                        {/* PANNELLI ELIMINATI CON RR IN TEMPO REALE */}
                        {deadPlayers.length > 0 && roomData.state === 'ARENA' && (
                            <>
                                <div className="hidden md:flex flex-col w-32 md:w-40 shrink-0 bg-slate-900/90 border border-slate-700 rounded-2xl p-2 gap-2 h-full overflow-y-auto custom-scrollbar shadow-2xl backdrop-blur-md z-20">
                                    <h3 className="text-red-500 font-black uppercase text-[10px] md:text-xs text-center border-b border-slate-700 pb-2 mb-1 flex items-center justify-center gap-1"><HeartCrack className="w-3 h-3 md:w-4 md:h-4"/> Eliminati</h3>
                                    {deadPlayers.map(p => {
                                        const cInfo = CHARACTERS.find(c => c.id === p.characterId);
                                        return (
                                            <div key={p.id} className="flex flex-col items-center bg-slate-800/80 border border-slate-700 rounded-xl p-1.5 opacity-70 grayscale hover:grayscale-0 transition-all relative mt-2">
                                                {cInfo ? <img src={cInfo.img} className="w-8 h-8 md:w-10 md:h-10 object-cover rounded-lg mb-1" /> : <User className="w-8 h-8 text-slate-500 mb-1" />}
                                                <span className="text-[9px] md:text-[10px] font-bold text-slate-300 truncate w-full text-center line-through">{p.name}</span>
                                                <span className="text-[8px] text-red-400 font-bold mt-0.5 mb-1">Round {p.eliminatedInRound || '?'}</span>
                                                {roomData.config.isCompetitive && <div className="mb-1"><RankBadge rr={p.rr} /></div>}
                                                
                                                {roomData.config.isCompetitive && p.rrChange !== undefined && (
                                                    <div className={`absolute -top-3 -right-2 px-1.5 py-0.5 rounded-full text-[10px] md:text-[11px] font-black shadow-md ${p.rrChange > 0 ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
                                                        {p.rrChange > 0 ? `+${p.rrChange}` : p.rrChange}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                                <div className="md:hidden absolute left-2 top-[90px] bottom-4 w-24 bg-slate-900/90 border border-slate-700 rounded-2xl p-2 flex flex-col gap-2 overflow-y-auto custom-scrollbar shadow-2xl backdrop-blur-md z-20">
                                    <h3 className="text-red-500 font-black uppercase text-[9px] text-center border-b border-slate-700 pb-1.5 mb-1 flex items-center justify-center gap-1"><HeartCrack className="w-3 h-3"/> Eliminati</h3>
                                    {deadPlayers.map(p => {
                                        const cInfo = CHARACTERS.find(c => c.id === p.characterId);
                                        return (
                                            <div key={p.id} className="flex flex-col items-center bg-slate-800/80 border border-slate-700 rounded-xl p-1.5 opacity-70 grayscale relative mt-2">
                                                {cInfo && <img src={cInfo.img} className="w-8 h-8 object-cover rounded-lg mb-1" />}
                                                <span className="text-[8px] font-bold text-slate-300 truncate w-full text-center line-through">{p.name}</span>
                                                <span className="text-[7px] text-red-400 font-bold mt-0.5 mb-1">Round {p.eliminatedInRound || '?'}</span>
                                                
                                                {roomData.config.isCompetitive && p.rrChange !== undefined && (
                                                    <div className={`absolute -top-2 -right-2 px-1.5 py-0.5 rounded-full text-[9px] font-black shadow-md ${p.rrChange > 0 ? 'bg-emerald-500 text-white' : 'bg-red-500 text-white'}`}>
                                                        {p.rrChange > 0 ? `+${p.rrChange}` : p.rrChange}
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    })}
                                </div>
                            </>
                        )}

                        <div className="flex-1 h-full flex flex-col relative overflow-y-auto custom-scrollbar w-full">
                            
                            {/* SCHERMATA CHAR_SELECT */}
                            {roomData.state === 'CHAR_SELECT' && (
                                <div className="flex flex-col h-full w-full max-w-7xl mx-auto animate-in fade-in">
                                    <div className="text-center mb-4 bg-slate-800/80 py-3 rounded-2xl border border-slate-700/50 backdrop-blur-sm shrink-0">
                                        <h1 className="text-2xl md:text-3xl font-black text-white uppercase tracking-wider">
                                            {me?.isReady ? "In attesa degli altri..." : "Seleziona il Personaggio"}
                                        </h1>
                                    </div>

                                    <div className="flex flex-col md:flex-row gap-4 flex-1 min-h-0">
                                        {/* Lista Giocatori */}
                                        <div className="w-full md:w-64 bg-slate-800/80 rounded-3xl border border-slate-600 p-4 flex flex-col gap-2 overflow-y-auto shrink-0 custom-scrollbar">
                                            <h3 className="text-slate-400 font-bold uppercase text-xs mb-2">Giocatori ({playersList.length}/{roomData.config.maxPlayers})</h3>
                                            {playersList.map(p => {
                                                const char = CHARACTERS.find(c => c.id === p.characterId);
                                                return (
                                                    <div key={p.id} className={`shrink-0 flex items-center gap-3 p-2.5 rounded-xl transition-all ${p.isReady ? 'bg-emerald-900/40 border border-emerald-500/30' : 'bg-slate-700/50 border border-slate-600'}`}>
                                                        <div className={`w-10 h-10 rounded-lg flex items-center justify-center p-0.5 ${char ? char.color : 'bg-slate-800'} ${char ? char.shadow : ''} shadow-lg shrink-0`}>
                                                            {char ? <img src={char.img} className="w-full h-full object-cover rounded-md" /> : <User className="w-5 h-5 text-slate-500" />}
                                                        </div>
                                                        <div className="flex-1 overflow-hidden">
                                                            <p className={`font-bold truncate text-sm ${p.id === user.uid ? 'text-yellow-400' : 'text-white'} flex items-center gap-2`}>
                                                                {p.name}
                                                            </p>
                                                            <p className="text-[10px] uppercase text-slate-400 flex items-center gap-1 mt-1">
                                                                {p.isReady ? <><Check className="w-3 h-3 text-emerald-400"/> Pronto</> : p.isBot ? '...' : 'Scegliendo...'}
                                                                {roomData.config.isCompetitive && <RankBadge rr={p.rr} />}
                                                            </p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Griglia Selezione */}
                                        <div className="flex-1 flex flex-col min-h-0 bg-slate-800/40 rounded-3xl border border-slate-600 p-4 overflow-hidden relative">
                                            {me?.isReady && !allHumansReady && <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm z-20 flex items-center justify-center rounded-3xl"><span className="bg-slate-800 border-2 border-emerald-500 text-emerald-400 font-bold px-6 py-3 rounded-full animate-pulse shadow-xl">Pronto! In attesa degli altri...</span></div>}
                                            <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4 overflow-y-auto custom-scrollbar pr-2 pb-4">
                                                {CHARACTERS.map(char => {
                                                    const isTaken = playersList.some(p => p.characterId === char.id && p.id !== user.uid);
                                                    const isMine = me?.characterId === char.id;
                                                    return (
                                                        <div
                                                            key={char.id}
                                                            onClick={() => { if(!me?.isReady && !isTaken) updateRoom({ [`players.${user.uid}.characterId`]: char.id }) }}
                                                            role="button"
                                                            className={`relative w-full rounded-2xl border-4 overflow-hidden transition-transform cursor-pointer ${isMine ? 'border-white scale-105 z-10' : 'border-transparent'} ${isTaken ? 'opacity-30 grayscale cursor-not-allowed' : 'hover:scale-105'} ${char.color}`}
                                                            style={{ paddingBottom: '100%' }}
                                                        >
                                                            <div className="absolute inset-0">
                                                                <img src={char.img} className="w-full h-full object-cover" />
                                                                <div className="absolute inset-x-0 bottom-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent p-2 pt-8 flex items-end">
                                                                    <span className="block w-full font-black text-white uppercase text-[9px] sm:text-[10px] truncate text-center drop-shadow-md leading-none">{char.name}</span>
                                                                </div>
